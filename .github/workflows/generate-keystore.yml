name: Generate Permanent Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04

    steps:
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Keystore
        env:
          PASS: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          set -e

          if [ -z "$PASS" ]; then
            echo "ANDROID_SIGNING_PASSWORD missing!"
            exit 1
          fi

          if [ "${#PASS}" -lt 12 ]; then
            echo "Password must be at least 12 characters."
            exit 1
          fi

          mkdir -p signing

          keytool -genkeypair \
            -keystore signing/slimex-release.jks \
            -storetype JKS \
            -alias slimex-cloud-camera \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000 \
            -dname "CN=SlimeX Cloud Camera, OU=SlimeX Development, O=SlimeX, L=Nagaon, ST=Assam, C=IN" \
            -storepass "$PASS" \
            -keypass "$PASS"

          base64 -w 0 signing/slimex-release.jks > signing/keystore-base64.txt

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: SlimeX-Permanent-Keystore
          path: signing/
          retention-days: 30
