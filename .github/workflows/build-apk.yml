name: Build APKs

# Two jobs, one app:
#   • debug   — unit tests + debug APK (works with no signing material at all)
#   • release — signed release APK *and* signed release AAB, both verified with
#               apksigner (APK) and jarsigner (AAB) before they are uploaded.
#
# Release signing material is NEVER in this repository. The release job takes it from repository
# secrets when they exist, and otherwise generates a throwaway key inside the runner so the
# signing path itself is still built and verified:
#
#   RELEASE_KEYSTORE_BASE64    base64 of your .jks  (base64 -w0 slimex-release.jks)
#   RELEASE_KEYSTORE_PASSWORD  store password
#   RELEASE_KEY_ALIAS          key alias
#   RELEASE_KEY_PASSWORD       key password (optional, defaults to the store password)
#
# The throwaway key proves the pipeline signs and verifies correctly, but an APK signed with it
# cannot be distributed and cannot upgrade an install signed with your real key — set the secrets
# for anything you actually ship.
#
# The Android SDK is the one preinstalled on the runner image; the failing third-party
# "setup-android" action is deliberately not used. Failures are re-emitted as workflow annotations
# (`::error::…`) so the reason is visible without opening the raw log.

on:
  push:
    branches:
      - 'arena/**'
      - 'feature/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'

jobs:
  build:
    name: assembleDebug + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK and install build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::No Android SDK found at $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "build-tools present:"
          ls "$SDK/build-tools"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/unit.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            ./.github/scripts/report-failure.sh "$RUNNER_TEMP/unit.log" "Unit tests failed"
            exit "$status"
          fi

      - name: Assemble debug APK
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace clean assembleDebug 2>&1 | tee "$RUNNER_TEMP/debug.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            ./.github/scripts/report-failure.sh "$RUNNER_TEMP/debug.log" "assembleDebug failed"
            exit "$status"
          fi

      - name: Show APK details
        run: |
          ls -lh app/build/outputs/apk/debug/
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk \
            | head -n 5 || true

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: slimex-cloud-camera-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: assembleRelease + bundleRelease (signed and verified)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK and install build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::No Android SDK found at $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "build-tools present:"
          ls "$SDK/build-tools"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      # ---------------------------------------------------------------------------------------
      # Signing material: repository secrets when configured, an ephemeral CI key otherwise.
      # It is written to $RUNNER_TEMP — never into the workspace — and no password is echoed.
      # ---------------------------------------------------------------------------------------
      - name: Prepare signing material
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          rm -f "$KEYSTORE_PATH"

          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            STORE_PASSWORD="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            SOURCE="repository secrets"
          else
            STORE_PASSWORD="$(openssl rand -hex 24)"
            ALIAS="slimex-ci"
            KEY_PASS="$STORE_PASSWORD"
            keytool -genkeypair \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASS" \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=SlimeX CI, OU=CI, O=SlimeX Cloud Camera, L=Guwahati, ST=Assam, C=IN"
            SOURCE="ephemeral key generated in this runner (no release secrets configured)"
          fi

          chmod 600 "$KEYSTORE_PATH"
          # Fail loudly if the keystore cannot be opened with the supplied password.
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$ALIAS" > /dev/null

          echo "::notice::Release signing material: $SOURCE"
          {
            echo "keystore=$KEYSTORE_PATH"
            echo "store_password=$STORE_PASSWORD"
            echo "key_alias=$ALIAS"
            echo "key_password=$KEY_PASS"
            echo "source=$SOURCE"
          } >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------------------------
      # The two builds that must both end up signed.
      # ---------------------------------------------------------------------------------------
      - name: Build signed release APK and AAB
        # Passwords reach Gradle through the environment, never interpolated into the step script.
        env:
          SIGNING_STORE_FILE: ${{ steps.signing.outputs.keystore }}
          SIGNING_STORE_PASSWORD: ${{ steps.signing.outputs.store_password }}
          SIGNING_KEY_ALIAS: ${{ steps.signing.outputs.key_alias }}
          SIGNING_KEY_PASSWORD: ${{ steps.signing.outputs.key_password }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SIGNING_STORE_FILE:?}" "${SIGNING_STORE_PASSWORD:?}" "${SIGNING_KEY_ALIAS:?}" "${SIGNING_KEY_PASSWORD:?}"

          set +e
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$SIGNING_STORE_FILE" \
            -Pandroid.injected.signing.store.password="$SIGNING_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$SIGNING_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$SIGNING_KEY_PASSWORD" \
            2>&1 | tee "$RUNNER_TEMP/release.log"
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            ./.github/scripts/report-failure.sh "$RUNNER_TEMP/release.log" "assembleRelease/bundleRelease failed"
            exit "$status"
          fi

      # ---------------------------------------------------------------------------------------
      # Verification. Fails the job if either artifact is unsigned, or if the APK was signed by a
      # different certificate than the keystore injected above.
      # ---------------------------------------------------------------------------------------
      - name: Verify APK signature (apksigner) and AAB signature (jarsigner)
        env:
          KEYSTORE: ${{ steps.signing.outputs.keystore }}
          STORE_PASSWORD: ${{ steps.signing.outputs.store_password }}
          KEY_ALIAS: ${{ steps.signing.outputs.key_alias }}
          KEYSTORE_SOURCE: ${{ steps.signing.outputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS="$SDK/build-tools/35.0.0"
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          mkdir -p build-verification

          echo "── produced outputs ──"
          ls -l app/build/outputs/apk/release app/build/outputs/bundle/release

          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            echo "::error::An UNSIGNED APK was produced — the release signing config was not applied."
            exit 1
          fi
          if [ ! -f "$APK" ]; then
            echo "::error::$APK is missing — assembleRelease did not produce a signed APK."
            exit 1
          fi
          if [ ! -f "$AAB" ]; then
            echo "::error::$AAB is missing — bundleRelease did not produce a bundle."
            exit 1
          fi

          echo
          echo "── apksigner verify (APK) ──"
          if ! "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" \
              | tee build-verification/apk-signature.txt; then
            echo "::error::apksigner could not verify $APK"
            exit 1
          fi

          echo
          echo "── zipalign check (APK) ──"
          if "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" > /dev/null; then
            echo "4-byte aligned: OK"
          else
            echo "::error::$APK is not zip-aligned"
            exit 1
          fi

          echo
          echo "── jarsigner -verify (AAB) ──"
          jarsigner -verify -verbose -certs "$AAB" > build-verification/aab-signature.txt 2>&1 || true
          jarsigner -verify "$AAB" | tee -a build-verification/aab-signature.txt
          if ! grep -q "jar verified" build-verification/aab-signature.txt; then
            echo "::error::jarsigner did not verify $AAB"
            exit 1
          fi

          echo
          echo "── the signature comes from the injected keystore ──"
          EXPECTED="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" \
            | sed -n 's/.*SHA256: //p' | head -n1 | tr -d ':' | tr 'A-F' 'a-f')"
          APK_SHA="$(sed -n 's/.*certificate SHA-256 digest: //p' build-verification/apk-signature.txt \
            | head -n1 | tr -d ':' | tr 'A-F' 'a-f')"

          echo "keystore SHA-256 : $EXPECTED"
          echo "APK signer       : $APK_SHA"

          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$APK_SHA" ]; then
            echo "::error::The APK is signed by a different certificate than the injected keystore."
            exit 1
          fi

          echo "::notice::APK signature verified by apksigner (v2/v3), signer SHA-256 $APK_SHA"
          echo "::notice::AAB signature verified by jarsigner (jar verified)"
          echo "::notice::Release signing material: $KEYSTORE_SOURCE"

          {
            echo "### Release signing verification"
            echo
            echo "- Keystore source: $KEYSTORE_SOURCE"
            echo "- APK signer certificate SHA-256: \`$APK_SHA\` (matches the injected keystore)"
            echo "- apksigner: verified · jarsigner (AAB): jar verified · zipalign: OK"
            echo
            echo '```'
            head -n 12 build-verification/apk-signature.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slimex-cloud-camera-release-signed
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            build-verification/*.txt
          if-no-files-found: error
          retention-days: 30
