# BUILD APK + AAB
# This workflow builds debug and signed release packages.

name: Build APK+AAB With Sing

on:
  push:
    branches:
      - 'arena/**'
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'

jobs:

  # ==========================================
  # JOB 1: DEBUG APK + UNIT TESTS
  # ==========================================

  debug:
    name: Assemble Debug APK and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found: $SDK"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Slimex-Cloud-Camera-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # ==========================================
  # JOB 2: SIGNED RELEASE APK + AAB
  # ==========================================

  release:
    name: Build Signed Release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Required Signing Secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          [ -n "$KEYSTORE_BASE64" ] || {
            echo "::error::Missing RELEASE_KEYSTORE_BASE64"
            exit 1
          }

          [ -n "$STORE_PASSWORD" ] || {
            echo "::error::Missing RELEASE_KEYSTORE_PASSWORD"
            exit 1
          }

          [ -n "$KEY_ALIAS" ] || {
            echo "::error::Missing RELEASE_KEY_ALIAS"
            exit 1
          }

          [ -n "$KEY_PASSWORD" ] || KEY_PASSWORD="$STORE_PASSWORD"

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

      - name: Restore Release Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/slimex-release.jks"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          chmod 600 "$KEYSTORE_PATH"

          echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Build Signed Release APK and AAB
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEY_PASSWORD="${KEY_PASSWORD:-$STORE_PASSWORD}"

          ./gradlew clean assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$RELEASE_STORE_FILE" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --stacktrace

      - name: Verify Signed APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          keytool -list \
            -keystore "$RELEASE_STORE_FILE" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Verify Signed AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB="$(find app/build/outputs/bundle/release -name '*.aab' -print -quit)"
          test -n "$AAB"

          jarsigner -verify -verbose -certs "$AAB"

      - name: Upload Signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Slimex-Cloud-Camera-Signed-Release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup Keystore
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/slimex-release.jks"
