name: Build APKs

on:
push:
branches:
- 'arena/'
- 'feature/'
pull_request:
workflow_dispatch:

permissions:
contents: read

concurrency:
group: build-apk-${{ github.ref }}
cancel-in-progress: true

env:
GRADLE_OPTS: '-Dorg.gradle.daemon=false'

jobs:

==========================================

JOB 1: DEBUG APK + UNIT TESTS

==========================================

build:
name: assembleDebug + unit tests
runs-on: ubuntu-latest
timeout-minutes: 45

steps:

  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Verify Android SDK and Install Build Tools
    shell: bash
    run: |
      set -euo pipefail

      SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

      if [ ! -d "$SDK" ]; then
        echo "::error::Android SDK not found: $SDK"
        exit 1
      fi

      echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      SDKMANAGER="$(command -v sdkmanager || true)"

      if [ -z "$SDKMANAGER" ]; then
        SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
      fi

      "$SDKMANAGER" --version

      yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      "$SDKMANAGER" --install \
        "platforms;android-35" \
        "build-tools;35.0.0" \
        "platform-tools"

      ls "$SDK/build-tools"

  - name: Gradle Cache
    uses: actions/cache@v4
    with:
      path: |
        ~/.gradle/caches
        ~/.gradle/wrapper
      key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
      restore-keys: |
        gradle-${{ runner.os }}-

  - name: Make Gradle Wrapper Executable
    run: chmod +x ./gradlew

  - name: Run Unit Tests
    shell: bash
    run: |
      set -o pipefail

      ./gradlew \
        --no-daemon \
        --console=plain \
        testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/unit.log"

  - name: Assemble Debug APK
    shell: bash
    run: |
      set -o pipefail

      ./gradlew \
        --no-daemon \
        --console=plain \
        clean assembleDebug 2>&1 | tee "$RUNNER_TEMP/debug.log"

  - name: Show Debug APK Details
    run: |
      ls -lh app/build/outputs/apk/debug/

      "$ANDROID_HOME/build-tools/35.0.0/aapt" \
        dump badging app/build/outputs/apk/debug/app-debug.apk \
        | head -n 5 || true

  - name: Upload Unit Test Report
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: unit-test-report
      path: app/build/reports/tests/testDebugUnitTest
      if-no-files-found: ignore
      retention-days: 30

  - name: Upload Debug APK
    uses: actions/upload-artifact@v4
    with:
      name: slimex-cloud-camera-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 30

==========================================

JOB 2: PERMANENT SIGNED RELEASE APK + AAB

==========================================

release:
name: Signed Release APK + AAB
runs-on: ubuntu-latest
timeout-minutes: 60

# Do not expose release signing secrets to pull requests.
if: github.event_name != 'pull_request'

steps:

  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Verify Android SDK and Install Build Tools
    shell: bash
    run: |
      set -euo pipefail

      SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

      if [ ! -d "$SDK" ]; then
        echo "::error::Android SDK not found: $SDK"
        exit 1
      fi

      echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      SDKMANAGER="$(command -v sdkmanager || true)"

      if [ -z "$SDKMANAGER" ]; then
        SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
      fi

      "$SDKMANAGER" --version

      yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      "$SDKMANAGER" --install \
        "platforms;android-35" \
        "build-tools;35.0.0" \
        "platform-tools"

  - name: Gradle Cache
    uses: actions/cache@v4
    with:
      path: |
        ~/.gradle/caches
        ~/.gradle/wrapper
      key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
      restore-keys: |
        gradle-${{ runner.os }}-

  - name: Make Gradle Wrapper Executable
    run: chmod +x ./gradlew

  # ==========================================
  # RESTORE PERMANENT KEYSTORE
  # ==========================================

  - name: Validate Release Signing Secrets
    env:
      KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
    shell: bash
    run: |
      set -euo pipefail

      if [ -z "${KEYSTORE_BASE64:-}" ]; then
        echo "::error::Missing RELEASE_KEYSTORE_BASE64 secret"
        exit 1
      fi

      if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
        echo "::error::Missing RELEASE_KEYSTORE_PASSWORD secret"
        exit 1
      fi

      if [ -z "${KEY_ALIAS:-}" ]; then
        echo "::error::Missing RELEASE_KEY_ALIAS secret"
        exit 1
      fi

      echo "Release signing secrets are configured."

  - name: Restore Permanent Release Keystore
    id: signing
    env:
      KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    shell: bash
    run: |
      set -euo pipefail

      KEYSTORE_PATH="$RUNNER_TEMP/slimex-release.jks"

      printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

      if [ ! -s "$KEYSTORE_PATH" ]; then
        echo "::error::Keystore file is empty or invalid"
        exit 1
      fi

      STORE_PASSWORD="$KEYSTORE_PASSWORD"
      PRIVATE_KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"

      chmod 600 "$KEYSTORE_PATH"

      keytool -list \
        -keystore "$KEYSTORE_PATH" \
        -storepass "$STORE_PASSWORD" \
        -alias "$KEY_ALIAS" >/dev/null

      {
        echo "keystore=$KEYSTORE_PATH"
        echo "store_password=$STORE_PASSWORD"
        echo "key_alias=$KEY_ALIAS"
        echo "key_password=$PRIVATE_KEY_PASSWORD"
      } >> "$GITHUB_OUTPUT"

      echo "::notice::Permanent release keystore restored successfully."

  # ==========================================
  # BUILD SIGNED APK + AAB
  # ==========================================

  - name: Build Signed Release APK and AAB
    env:
      SIGNING_STORE_FILE: ${{ steps.signing.outputs.keystore }}
      SIGNING_STORE_PASSWORD: ${{ steps.signing.outputs.store_password }}
      SIGNING_KEY_ALIAS: ${{ steps.signing.outputs.key_alias }}
      SIGNING_KEY_PASSWORD: ${{ steps.signing.outputs.key_password }}
    shell: bash
    run: |
      set -euo pipefail

      : "${SIGNING_STORE_FILE:?Missing keystore path}"
      : "${SIGNING_STORE_PASSWORD:?Missing store password}"
      : "${SIGNING_KEY_ALIAS:?Missing key alias}"
      : "${SIGNING_KEY_PASSWORD:?Missing key password}"

      ./gradlew \
        --no-daemon \
        --console=plain \
        assembleRelease \
        bundleRelease \
        -Pandroid.injected.signing.store.file="$SIGNING_STORE_FILE" \
        -Pandroid.injected.signing.store.password="$SIGNING_STORE_PASSWORD" \
        -Pandroid.injected.signing.key.alias="$SIGNING_KEY_ALIAS" \
        -Pandroid.injected.signing.key.password="$SIGNING_KEY_PASSWORD" \
        2>&1 | tee "$RUNNER_TEMP/release.log"

  # ==========================================
  # VERIFY SIGNED APK + AAB
  # ==========================================

  - name: Verify APK and AAB Signatures
    env:
      KEYSTORE: ${{ steps.signing.outputs.keystore }}
      STORE_PASSWORD: ${{ steps.signing.outputs.store_password }}
      KEY_ALIAS: ${{ steps.signing.outputs.key_alias }}
    shell: bash
    run: |
      set -euo pipefail

      SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
      BUILD_TOOLS="$SDK/build-tools/35.0.0"

      APK="app/build/outputs/apk/release/app-release.apk"
      AAB="app/build/outputs/bundle/release/app-release.aab"

      mkdir -p build-verification

      if [ ! -f "$APK" ]; then
        echo "::error::Signed release APK not found"
        exit 1
      fi

      if [ ! -f "$AAB" ]; then
        echo "::error::Release AAB not found"
        exit 1
      fi

      # Verify APK cryptographic signature.
      "$BUILD_TOOLS/apksigner" verify \
        --verbose \
        --print-certs \
        "$APK" | tee build-verification/apk-signature.txt

      # Verify APK alignment.
      "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"

      # Verify AAB signature.
      jarsigner -verify -verbose -certs "$AAB" \
        > build-verification/aab-signature.txt 2>&1

      jarsigner -verify "$AAB"

      # Compare APK signing certificate with permanent keystore.
      EXPECTED_SHA="$(
        keytool -list -v \
          -keystore "$KEYSTORE" \
          -storepass "$STORE_PASSWORD" \
          -alias "$KEY_ALIAS" \
          | sed -n 's/.*SHA256: //p' \
          | head -n 1 \
          | tr -d ':' \
          | tr 'A-F' 'a-f'
      )"

      ACTUAL_SHA="$(
        sed -n 's/.*certificate SHA-256 digest: //p' \
          build-verification/apk-signature.txt \
          | head -n 1 \
          | tr -d ':' \
          | tr 'A-F' 'a-f'
      )"

      echo "Expected certificate: $EXPECTED_SHA"
      echo "APK certificate: $ACTUAL_SHA"

      if [ -z "$EXPECTED_SHA" ] || [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
        echo "::error::APK certificate does not match the permanent keystore"
        exit 1
      fi

      echo "::notice::APK signature verified successfully."
      echo "::notice::AAB signature verified successfully."
      echo "::notice::Permanent signing certificate matched."

      {
        echo "### Release Build Verification"
        echo
        echo "- APK signature: Verified"
        echo "- AAB signature: Verified"
        echo "- APK alignment: Verified"
        echo "- Permanent certificate: Matched"
        echo "- Certificate SHA-256: $ACTUAL_SHA"
      } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================
  # UPLOAD FINAL RELEASE FILES
  # ==========================================

  - name: Upload Signed APK and AAB
    uses: actions/upload-artifact@v4
    with:
      name: slimex-cloud-camera-release-signed
      path: |
        app/build/outputs/apk/release/app-release.apk
        app/build/outputs/bundle/release/app-release.aab
        build-verification/*.txt
      if-no-files-found: error
      retention-days: 30

  # ==========================================
  # CLEANUP PRIVATE KEYSTORE
  # ==========================================

  - name: Cleanup Signing Files
    if: always()
    shell: bash
    run: |
      rm -f "$RUNNER_TEMP/slimex-release.jks"
